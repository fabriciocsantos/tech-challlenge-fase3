spring.application.name=notificacao-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/notificacao_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificacao-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=br.com.fiap.techchallenge.notificacao.notificacao_service.notificacao.ConsultaEventoDeserializer
